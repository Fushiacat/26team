[project]
name = "teammatch"
version = "0.1.0"
description = "Telegram-бот для быстрого матчинга участников хакатона"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.12,<4",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
